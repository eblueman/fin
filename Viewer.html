<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>وضعیت مطالبات</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root { --main: #1e40af; --bg: #f1f5f9; --accent: #059669; --white: #ffffff; }
    body { font-family: Tahoma, sans-serif; margin: 0; padding: 10px; background: var(--bg); direction: rtl; color: #1e293b; }
    .container { max-width: 1400px; margin: auto; background: var(--white); border-radius: 20px; padding: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    h2 { margin: 10px 0; color: var(--main); text-align: center; font-size: 20px; font-weight: bold; }
    
    /* نوار وضعیت و جستجو */
    .status-bar { display: flex; justify-content: space-between; margin-bottom: 12px; padding: 10px 15px; background: #e0e7ff; border-radius: 12px; font-size: 12px; color: #3730a3; }
    input#search { width: 100%; box-sizing: border-box; padding: 15px; margin-bottom: 12px; font-size: 16px; border-radius: 15px; border: 2px solid #cbd5e1; outline: none; background: #fff; transition: 0.3s; }
    input#search:focus { border-color: var(--main); }

    /* جدول */
    .table-wrap { overflow-x: auto; border-radius: 15px; border: 1px solid #e2e8f0; max-height: 55vh; }
    table { width: 100%; min-width: 1200px; border-collapse: collapse; font-size: 13px; }
    th { background: var(--main); color: #fff; position: sticky; top: 0; z-index: 10; padding: 15px 8px; cursor: pointer; white-space: nowrap; }
    td { padding: 14px 8px; border-bottom: 1px solid #f1f5f9; text-align: center; white-space: nowrap; cursor: pointer; }
    tr:nth-child(even) { background: #f8fafc; }
    tr:active { background: #dbeafe; } /* افکت لمس روی موبایل */

    /* پاپ‌آپ (Modal) */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
    .modal-content { background: #fff; width: 90%; max-width: 500px; max-height: 85%; border-radius: 24px; overflow-y: auto; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); position: relative; animation: slideUp 0.3s ease-out; }
    @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; margin-bottom: 15px; }
    .modal-header h4 { margin: 0; color: var(--main); font-size: 18px; }
    .close-btn { background: #fee2e2; color: #ef4444; border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; font-weight: bold; font-size: 18px; }

    .detail-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
    .detail-label { font-size: 13px; color: #64748b; font-weight: bold; flex: 1; }
    .detail-value { font-size: 14px; color: #1e293b; font-weight: bold; text-align: left; flex: 1; direction: ltr; }
    .val-text { direction: rtl; text-align: right; display: block; }

    /* سرجمع پایین */
    .totals-box { margin-top: 15px; padding: 15px; background: #fff; border: 2px solid var(--main); border-radius: 20px; }
    .total-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #e2e8f0; font-size: 14px; }
    .total-val { color: var(--accent); font-weight: bold; direction: ltr; }
    .calc-tag { font-size: 10px; background: #dcfce7; color: #15803d; padding: 2px 6px; border-radius: 10px; margin-right: 5px; }
    
    .num { font-family: 'Segoe UI', Tahoma; font-weight: bold; color: var(--accent); direction: ltr; display: inline-block; }
  </style>
</head>
<body>

<div class="container">
  <h2>وضعیت مطالبات</h2>
  <div class="status-bar">
    <span id="updateDate">در حال دریافت...</span>
    <span id="rowCount">۰ ردیف</span>
  </div>
  <input type="text" id="search" placeholder="جستجو در شرح تفصیلی..." />
  
  <div class="table-wrap">
    <table id="tbl" style="display:none;">
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>

  <div id="totalsContainer" class="totals-box" style="display:none;">
    <h3 style="text-align:center; font-size:16px; margin:0 0 10px 0; color:var(--main);">خلاصه وضعیت مدیریتی</h3>
    <div id="totalsList"></div>
  </div>
</div>

<!-- پاپ‌آپ جزئیات -->
<div id="modal" class="modal-overlay" onclick="closeModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h4>جزئیات کامل سطر</h4>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const GITHUB_RAW = "https://raw.githubusercontent.com/eblueman/fin/main/RepG.xlsx";
const GITHUB_API = "https://api.github.com/repos/eblueman/fin/commits?path=RepG.xlsx&per_page=1";
const TARGET_COL = "صفر روزه           (بااحتساب پیش پرداخت)";

let mainData = [];
let excelFooter = null;
let sortCol = null;
let sortAsc = false;

function formatNum(v) {
  const n = parseFloat(v);
  if (isNaN(n) || v === null) return v;
  return n.toLocaleString("en-US");
}

async function fetchMeta() {
  try {
    const res = await fetch(GITHUB_API);
    const data = await res.json();
    const date = new Date(data[0].commit.committer.date);
    document.getElementById("updateDate").textContent = "بروزرسانی: " + 
      new Intl.DateTimeFormat('fa-IR-u-ca-persian', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}).format(date);
  } catch(e) { document.getElementById("updateDate").textContent = "بروزرسانی: نامشخص"; }
}

function getCustomZeroDaySum() {
  return mainData.reduce((sum, row) => {
    let val = parseFloat(row[TARGET_COL]);
    return (!isNaN(val) && val > 0) ? sum + val : sum;
  }, 0);
}

function render() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const headRow = document.getElementById("head");
  const tableBody = document.getElementById("body");
  if (!mainData.length) return;

  const cols = Object.keys(mainData[0]);
  headRow.innerHTML = cols.map(c => `<th onclick="handleSort('${c}')">${c.trim()}</th>`).join("");

  let filtered = mainData.filter(r => String(r["شرح تفصیلی"] || "").toLowerCase().includes(q));

  if (sortCol) {
    filtered.sort((a, b) => {
      let v1 = a[sortCol], v2 = b[sortCol];
      return sortAsc ? (v1 > v2 ? 1 : -1) : (v1 < v2 ? 1 : -1);
    });
  }

  tableBody.innerHTML = filtered.map((row, idx) => {
    return `<tr onclick="showDetails(${mainData.indexOf(row)})">${cols.map((c, i) => {
      let v = row[c] ?? "";
      let isNumeric = (i >= 2 && !isNaN(parseFloat(v)));
      return `<td>${isNumeric ? `<span class="num">${formatNum(v)}</span>` : v}</td>`;
    }).join("")}</tr>`;
  }).join("");

  document.getElementById("tbl").style.display = "table";
  document.getElementById("rowCount").textContent = `${filtered.length} ردیف`;
  renderSummary(cols);
}

// نمایش پاپ‌آپ
function showDetails(index) {
  const row = mainData[index];
  const modalBody = document.getElementById("modalBody");
  let html = "";
  
  for (let key in row) {
    let val = row[key] ?? "-";
    let isNum = !isNaN(parseFloat(val)) && key !== "کد تفصیلی" && key !== "شرح تفصیلی";
    let displayVal = isNum ? formatNum(val) : `<span class="val-text">${val}</span>`;
    
    html += `
      <div class="detail-row">
        <div class="detail-label">${key.trim()}</div>
        <div class="detail-value">${displayVal}</div>
      </div>`;
  }
  
  modalBody.innerHTML = html;
  document.getElementById("modal").style.display = "flex";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

function renderSummary(cols) {
  const container = document.getElementById("totalsList");
  let html = "";
  cols.forEach((col, idx) => {
    if (idx < 2) return;
    let val = (col === TARGET_COL) ? getCustomZeroDaySum() : (excelFooter ? excelFooter[col] : 0);
    let tag = (col === TARGET_COL) ? `<span class="calc-tag">فقط مثبت</span>` : "";
    if (val) {
      html += `<div class="total-item"><span>${tag} ${col.trim()}</span><span class="total-val">${formatNum(val)}</span></div>`;
    }
  });
  container.innerHTML = html;
  document.getElementById("totalsContainer").style.display = "block";
}

function handleSort(c) {
  if (sortCol === c) sortAsc = !sortAsc; else { sortCol = c; sortAsc = false; }
  render();
}

function loadData() {
  const xhr = new XMLHttpRequest();
  xhr.open("GET", GITHUB_RAW, true);
  xhr.responseType = "arraybuffer";
  xhr.onload = function() {
    if (xhr.status === 200) {
      const data = new Uint8Array(xhr.response);
      const wb = XLSX.read(data, { type: "array" });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
      if (rows.length > 0) {
        excelFooter = rows.pop();
        mainData = rows;
        render();
      }
    }
  };
  xhr.send();
}

document.getElementById("search").addEventListener("input", render);
window.onload = () => { fetchMeta(); loadData(); };
</script>
</body>
</html>
